name: Voice samples
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: record
  cancel-in-progress: false
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/heart/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q kokoro soundfile
      - name: Make the samples
        run: python samples.py
      - name: Save the samples
        run: |
          git config user.name "voice-bot"; git config user.email "voice-bot@users.noreply.github.com"
          git add samples
          git commit -m "Voice samples" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
